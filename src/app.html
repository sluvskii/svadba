<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f7f2e9" />
		<meta name="robots" content="noindex, nofollow" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Алина и Камиль — 17 декабря 2026" />
		<meta
			property="og:description"
			content="Приглашаем вас разделить с нами самый тёплый зимний день. Нефтекамск, ресторан «Тантана»."
		/>
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<script>
			document.documentElement.classList.add('js');
			try {
				const lang = document.cookie.match(/(?:^|;\s*)lang=(ru|tt)/)?.[1];
				if (lang) document.documentElement.lang = lang === 'tt' ? 'tt' : 'ru';
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
